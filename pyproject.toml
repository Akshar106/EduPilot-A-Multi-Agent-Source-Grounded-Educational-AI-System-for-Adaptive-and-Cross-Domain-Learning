[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edupilot"
version = "2.0.0"
description = "A multi-agent, source-grounded educational AI system for adaptive and cross-domain learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Akshar Patel" },
    { name = "Khushi Shah" },
]
keywords = ["rag", "llm", "education", "multi-agent", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── Core API + server ────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    # ── LLM providers ────────────────────────────────────────────────────────
    "groq>=0.9.0",
    "google-genai>=1.0.0",
    # ── Environment ──────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    # ── Vector store ─────────────────────────────────────────────────────────
    "pinecone>=3.0.0",
    # ── Embeddings + reranking ───────────────────────────────────────────────
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    # ── Document extraction ──────────────────────────────────────────────────
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    # ── Security ─────────────────────────────────────────────────────────────
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    # ── Scientific computing ─────────────────────────────────────────────────
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",       # FastAPI TestClient transport
    "ruff>=0.5.0",
]

[project.scripts]
edupilot-reindex = "edupilot.cli.reindex:main"
edupilot-evaluate = "edupilot.cli.evaluate:main"

[project.urls]
Repository = "https://github.com/Akshar106/EduPilot-A-Multi-Agent-Source-Grounded-Educational-AI-System-for-Adaptive-and-Cross-Domain-Learning"

# ---------------------------------------------------------------------------
# Packaging — src layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The single-page frontend ships inside the package so STATIC_DIR resolves
# whether the app is run from a checkout or an installed wheel.
edupilot = ["web/static/*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are handled by the formatter, not enforced
    "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
    # zip(strict=) changes behaviour: today a length mismatch truncates, with
    # strict=True it raises mid-request. Worth revisiting deliberately, per
    # call site, rather than as a blanket sweep.
    "B905",
    # `class Role(str, Enum)` is intentional and documented in security/auth.py.
    # str() already yields the value, so StrEnum would be a pure rename inside
    # the auth and error-envelope types for no behavioural gain.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["edupilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
