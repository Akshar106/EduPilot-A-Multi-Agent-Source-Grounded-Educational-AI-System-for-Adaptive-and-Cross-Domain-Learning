name: Deploy

# Publishes the image to GHCR and rolls it out to Fly.
#
# Only on main, and only after CI is green — `workflow_run` waits for the CI
# workflow to *conclude*, then this checks it actually succeeded. Triggering on
# push instead would race the test job and could ship a red build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual rollout, e.g. to re-deploy after changing a secret.
  workflow_dispatch:

concurrency:
  # Never two deploys at once; a superseded rollout is pointless but a
  # half-applied one is worse.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `workflow_run` fires on failure too, so gate explicitly.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically; no secret to manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          # Lowercase: GHCR rejects uppercase in a repository path, and GitHub
          # usernames frequently contain capitals.
          REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO"                                    >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/$REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: roll out to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # Pinned to the exact commit's image rather than :latest, so a rollback
        # is `flyctl deploy --image <old-sha>` and a re-run cannot silently pick
        # up a newer build.
        run: |
          flyctl deploy \
            --image "${{ needs.publish.outputs.image }}" \
            --strategy immediate \
            --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify the rollout actually serves
        # A successful deploy command is not proof the app works. Fly reports
        # success once machines start; this checks the app answers.
        run: |
          APP=$(grep -m1 '^app =' fly.toml | cut -d'"' -f2)
          URL="https://${APP}.fly.dev/api/health"

          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 30 "$URL" 2>/dev/null) && {
              echo "$BODY"
              echo "$BODY" | grep -q '"status": *"ok"' && { echo "healthy"; exit 0; }
              echo "::warning::reachable but degraded — check the Fly secrets"
              exit 0
            }
            echo "waiting for $URL ($i/30)"
            sleep 10
          done

          echo "::error::app never responded after deploy"
          exit 1
